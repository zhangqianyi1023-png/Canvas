# Keep the SDK transport and agent loop, but remove every model-facing shell tool.
- id: llm-deepseek
  disabled: true

- id: persistent-bash
  disabled: true

- id: persistent-pwsh
  disabled: true

- insert:
    - id: attachment-local
      name: '@deepseek-ai/dsh-attachment-local'

    - id: inux-copilot-llm
      name: '@deepseek-ai/dsh-llm-pi-ai'
      config:
        providers:
          inux-copilot:
            displayName: InUx Copilot
            apiKeyEnv: INUX_COPILOT_API_KEY
            api: openai-completions
            baseURL: !!js process.env.INUX_COPILOT_BASE_URL
            defaultContextWindow: !!js Number(process.env.INUX_COPILOT_CONTEXT_WINDOW ?? 131072)
            defaultMaxTokens: !!js Number(process.env.INUX_COPILOT_MAX_TOKENS ?? 8192)
            defaultInput: [text, image]
            retryPolicy:
              mode: normal
              maxRetries: 1
            models:
              - id: !!js process.env.INUX_COPILOT_MODEL
                contextWindow: !!js Number(process.env.INUX_COPILOT_CONTEXT_WINDOW ?? 131072)
                maxTokens: !!js Number(process.env.INUX_COPILOT_MAX_TOKENS ?? 8192)
                reasoningEfforts: false

    - id: inux-canvas-tools
      name: './canvas-tools.mjs'
